<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>L'ARTISAN 06 — Boutique</title>

<!-- Intégration de la librairie Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase SDKs (Compat v10) - Ajout de Storage pour les médias -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

<!-- Polices d'écriture -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg-dark: #000000;
  --bg-gradient: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
  
  --bg2: #111111;
  --card: #151D1F; 
  --card2: #262D2D;
  
  --border: #FFD700; 
  --primary-yellow: #FFD700;
  --dark-yellow: #B8860B; 
  
  --text: #FFFFFF;
  --muted: #E0E0E0;
  --danger: #ff4c4c;
  
  --radius: 17px;
  --safe-bottom: env(safe-area-inset-bottom,0px);
  
  --shadow-gold: 0 0 15px rgba(255, 215, 0, 0.2);
}

@keyframes glare {
    0% { transform: translateX(-100%) rotate(15deg); }
    10% { transform: translateX(100%) rotate(15deg); }
    100% { transform: translateX(100%) rotate(15deg); }
}

.product-card, .category-button, .nav-btn.active, .cart-item, .info-card, .profile-row, .sheet, .product-sheet {
    position: relative;
    overflow: hidden;
}

.product-card::after, .category-button::after, .nav-btn.active::after, .cart-item::after, .info-card::after, .profile-row::after, .sheet::after, .product-sheet::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        to bottom right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0) 100%
    );
    transform: rotate(15deg);
    pointer-events: none;
    animation: glare 12s infinite;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width: 100%;
  min-height:100%;
  background: var(--bg-dark);
  background: var(--bg-gradient);
  background-attachment: fixed;
  overflow-x: hidden !important;
  position: relative;
}

body{
  color: var(--text);
  font-family:'Manrope',sans-serif;
  scrollbar-width: none;
}
body::-webkit-scrollbar {
  display: none;
}

button,input,textarea{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
  border: none;
  background: none;
  padding: 0;
}

button:active{
  transform:scale(.97);
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:100px;
  overflow-x: hidden;
}

.top{
  position:relative;
  z-index:30;
  padding:12px 14px 10px;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.logo{
  width:100%;
  aspect-ratio:1/1;
  max-height:430px;
  object-fit:cover;
  display:block;
  border-radius:20px;
  border: 1px solid var(--border);
  box-shadow: 
    var(--shadow-gold),
    0 0 20px rgba(255, 215, 0, 0.1);
  margin-bottom:13px;
}

.search{
  position:relative;
  margin-bottom:10px;
}

.search input{
  width:100%;
  height:48px;
  border-radius:14px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  padding:0 45px;
  outline:none;
  font-size:16px;
  transition: all 0.3s ease;
}

.search input:focus{
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.clear-search{
  display:none;
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background: var(--card2);
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}

.category-button{
  width:100%;
  height:52px;
  border: 1px solid var(--primary-yellow);
  border-radius:15px;
  background: linear-gradient(
    135deg,
    rgba(255, 215, 0, 0.15),
    rgba(0, 0, 0, 0.2)
  );
  color: var(--primary-yellow);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  font-size:14px;
  font-weight:800;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
  transition: 0.3s;
}

.category-button:active {
    background: rgba(255, 215, 0, 0.3);
}

.category-button .left{
  display:flex;
  align-items:center;
  gap:10px;
}

.category-button .arrow{
  transition:.3s;
  font-size: 20px;
  line-height: 1;
}

.category-button.open .arrow{
  transform:rotate(180deg);
}

.categories{
  display:none;
  margin-top:8px;
  padding:9px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius:15px;
  gap:7px;
  flex-wrap:wrap;
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.categories.open{
  display:flex;
}

.category{
  flex:1 1 calc(50% - 7px);
  min-height:42px;
  border-radius:11px;
  border: 1px solid #444;
  background: #111;
  color: var(--muted);
  font-size:12px;
  font-weight:800;
  transition: all 0.2s;
}

.category:hover {
    border-color: var(--dark-yellow);
}

.category.active{
  background: var(--primary-yellow);
  color: #000000;
  border-color: var(--primary-yellow);
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

main{
  padding:15px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:4px 0 13px;
  color: var(--primary-yellow);
  font-family:'Archivo Black',sans-serif;
  font-size:12px;
  letter-spacing:.13em;
  text-transform:uppercase;
  text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
}

.section-title:after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(
    90deg,
    var(--dark-yellow),
    transparent
  );
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.product-card{
  position:relative;
  overflow:hidden;
  background: var(--card);
  border: 1px solid #333;
  border-radius:17px;
  transition:all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.product-card:hover{
  border-color: var(--dark-yellow);
  transform: translateY(-3px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.4);
}

.product-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#000;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition: transform 0.4s ease;
}

.product-card:hover .product-image {
    transform: scale(1.05);
}

.product-badge{
  position:absolute;
  top:9px;
  left:9px;
  padding:4px 8px;
  border-radius:20px;
  background: rgba(0, 0, 0, 0.85);
  border: 1px solid var(--dark-yellow);
  color: var(--primary-yellow);
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.04em;
  z-index: 5;
}

.product-content{
  padding:10px;
}

.product-name{
  margin:0 0 4px;
  font-size:13px;
  font-weight:900;
  color: #fff;
}

.product-description{
  color: var(--muted);
  font-size:9.5px;
  line-height:1.4;
  min-height:27px;
  margin-bottom:9px;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
}

.product-price{
  color: var(--primary-yellow);
  font-size:12px;
  font-weight:900;
  text-shadow: 0 0 3px rgba(255, 215, 0, 0.3);
}

.add-button{
  width:32px;
  height:32px;
  border: 1px solid var(--primary-yellow);
  border-radius:10px;
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(0,0,0,0.4));
  color: var(--primary-yellow);
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  transition: all 0.2s;
  line-height: 1;
}

.add-button:hover {
    background: rgba(255, 215, 0, 0.3);
    box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
}

.add-button:active {
    transform: scale(0.95);
}

.empty{
  text-align:center;
  color: var(--muted);
  padding:60px 20px;
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
  opacity: 0.5;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  max-width:520px;
  margin:auto;
  padding:8px 8px calc(8px + var(--safe-bottom));
  background: rgba(0, 0, 0, 0.98);
  backdrop-filter:blur(15px);
  border-top: 1px solid var(--border);
  display:flex;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
}

.nav-btn{
  flex:1;
  border:0;
  background:none;
  color: var(--muted);
  padding:6px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:9.5px;
  font-weight:800;
  position:relative;
  transition: color 0.2s;
}

.nav-btn svg{
  width:22px;
  height:22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  transition: 0.2s;
}

.nav-btn.active{
  color: var(--primary-yellow);
  text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
}

.nav-btn.active svg {
    filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
}

.badge{
  position:absolute;
  top:0;
  right:20%;
  min-width:16px;
  height:16px;
  padding:0 4px;
  display:none;
  align-items:center;
  justify-content:center;
  background:var(--danger);
  color:#FFFFFF;
  border-radius:20px;
  font-size:8px;
  font-weight: 900;
  box-shadow: 0 0 8px rgba(255, 76, 76, 0.5);
}

.profile-developer {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.profile-developer-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 20px;
  text-decoration: none;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  background: rgba(255, 215, 0, 0.05);
  border: 1px solid rgba(255, 215, 0, 0.3);
  transition: all 0.3s;
}

.profile-developer-badge:active {
  background: rgba(255, 215, 0, 0.15);
  transform: scale(0.95);
}

.profile-verified {
  width: 12px;
  height: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--primary-yellow);
  color: #000;
  font-size: 8px;
  font-weight: 900;
}

/* Bouton Admin Designifié */
@keyframes borderGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.admin-access-btn {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  border-radius: 13px;
  background: #111;
  color: var(--primary-yellow);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  z-index: 1;
  transition: all 0.2s;
}

.admin-access-btn::before {
  content: '';
  position: absolute;
  top: -2px; left: -2px; right: -2px; bottom: -2px;
  background: linear-gradient(45deg, var(--primary-yellow), #000, var(--dark-yellow), #000);
  background-size: 300% 300%;
  z-index: -1;
  border-radius: 15px;
  animation: borderGlow 4s ease infinite;
}

.admin-access-btn:active {
  transform: scale(0.98);
}

.view{
  display:none;
}

.view.active{
  display:block;
}

.page-title{
  font-family:'Archivo Black',sans-serif;
  font-size:23px;
  margin-bottom:17px;
  color: #fff;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
}

.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  margin-bottom:9px;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.cart-thumb{
  width:52px;
  height:52px;
  flex:0 0 52px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:#000;
  overflow:hidden;
}

.cart-thumb img, .cart-thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cart-info{
  flex:1;
  min-width:0;
}

.cart-info h4{
  margin:0 0 4px;
  font-size:12.5px;
  color: #fff;
}

.cart-meta{
  color:var(--muted);
  font-size:10px;
}

.cart-right{
  text-align:right;
}

.cart-price{
  color: var(--primary-yellow);
  font-size:12.5px;
  font-weight:800;
  margin-bottom:5px;
}

.qty{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
}

.qty button{
  width:24px;
  height:24px;
  border:1px solid var(--border);
  border-radius:6px;
  background:var(--card2);
  color: var(--primary-yellow);
  font-size:16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qty span{
  min-width:15px;
  text-align:center;
  font-size:11px;
  font-weight:800;
  color: #fff;
}

.summary{
  margin-top:15px;
  padding:15px;
  background:var(--card);
  border: 1px solid var(--primary-yellow);
  border-radius:16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.4);
}

.summary-row{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
}

.summary-row.total{
  padding-top:10px;
  border-top:1px solid #333;
  color:var(--text);
  font-size:16px;
  font-weight:800;
}

.summary-row.total span:last-child{
  color: var(--primary-yellow);
}

.submit{
  width:100%;
  height:50px;
  margin-top:8px;
  border:0;
  border-radius:13px;
  background: var(--primary-yellow);
  color:#000;
  font-size:14px;
  font-weight:900;
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
  transition: all 0.2s;
  display:flex;
  align-items:center;
  justify-content:center;
}

.submit:active {
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
}

.order-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}

.submit.whatsapp {
  background: #25D366;
  color: #fff;
  box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
}

.submit.telegram {
  background: #229ED9;
  color: #fff;
  box-shadow: 0 0 20px rgba(34, 158, 217, 0.4);
}

.info-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:11px;
}

.info-card h3{
  margin:0 0 8px;
  color: var(--primary-yellow);
  font-size:15px;
}

.info-card p{
  margin:0;
  color:var(--muted);
  line-height:1.55;
  font-size:12.5px;
}

.socials{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:12px;
}

.social{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  text-decoration:none;
  font-weight:800;
  font-size:13px;
}

.social-icon{
  width:39px;
  height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 39px;
  border-radius:11px;
  background: var(--primary-yellow);
  color:#000;
  overflow:hidden;
}

.social-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile{
  text-align:center;
  padding:10px 0 20px;
}

.avatar{
  width:82px;
  height:82px;
  margin:auto;
  border-radius:50%;
  border: 2px solid var(--primary-yellow);
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  margin-top:10px;
  font-family:'Archivo Black',sans-serif;
  font-size:19px;
  color: #fff;
}

.profile-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.profile-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:8px;
  font-size:12.5px;
  font-weight:700;
  color: #fff;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:80;
  background:rgba(0, 0, 0, 0.85);
  opacity:0;
  pointer-events:none;
  transition: opacity .2s ease;
  backdrop-filter: blur(5px);
  width: 100vw;
  height: 100vh;
}

.overlay.open{
  opacity:1;
  pointer-events:auto;
}

.sheet{
  position:fixed;
  z-index:81;
  left:0;
  right:0;
  bottom:0;
  width: 100%;
  max-width:520px;
  margin:auto;
  max-height:90vh;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling: touch;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-bottom:0;
  border-radius:22px 22px 0 0;
  transform:translateY(100%);
  transition: transform .28s ease-out;
  padding-bottom:calc(22px + var(--safe-bottom));
  box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
}

.sheet.open{
  transform:translateY(0);
}

.handle{
  width:38px;
  height:4px;
  background: #444;
  border-radius:5px;
  margin:10px auto;
}

.close{
  position:absolute;
  right:14px;
  top:12px;
  width:31px;
  height:31px;
  border-radius:50%;
  border:1px solid #333;
  background:rgba(0, 0, 0, 0.6);
  color:#fff;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sheet-body{
  padding:12px 16px;
  width: 100%;
  overflow-x: hidden;
}

.sheet-body video {
  width: 100%;
  height: auto;
  max-height: 60vh;
  pointer-events: auto !important;
  z-index: 1;
  border-radius: 14px;
  display: block;
  background: #000;
  margin-bottom: 15px;
}

.sheet h2{
  font-family:'Archivo Black',sans-serif;
  font-size:21px;
  margin:9px 0;
  color: #fff;
}

.sheet-description{
  color:var(--muted);
  font-size:12.5px;
  line-height:1.55;
}

/* Clavier PIN */
.pin-display {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}
.pin-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  transition: 0.2s;
}
.pin-dot.filled {
  background: var(--primary-yellow);
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  max-width: 280px;
  margin: 0 auto 20px auto;
}
.pin-btn {
  width: 100%;
  aspect-ratio: 1/1;

<script>
// Gestion sécurisée des vidéos pour Telegram WebApp
function displayVideo(videoUrl, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  
  container.innerHTML = '';
  
  const video = document.createElement('video');
  video.src = videoUrl;
  video.controls = true;
  video.preload = 'metadata';
  video.style.cssText = `
    width: 100%;
    height: auto;
    max-width: 520px;
    display: block;
    border-radius: 14px;
    background: #000;
    pointer-events: auto;
  `;
  
  video.addEventListener('play', () => {
    document.body.classList.add('video-playing');
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.HapticFeedback?.impactOccurred?.('light');
    }
  });
  
  video.addEventListener('pause', () => {
    document.body.classList.remove('video-playing');
  });
  
  video.addEventListener('ended', () => {
    document.body.classList.remove('video-playing');
  });
  
  container.appendChild(video);
}

// Fonction pour charger une vidéo à partir d'une URL
function loadProductVideo(videoUrl) {
  const sheetBody = document.querySelector('.sheet-body');
  if (sheetBody) {
    // Nettoyer les vidéos précédentes
    const existingVideos = sheetBody.querySelectorAll('video');
    existingVideos.forEach(v => v.remove());
    
    // Créer et insérer la nouvelle vidéo
    const video = document.createElement('video');
    video.src = videoUrl;
    video.controls = true;
    video.preload = 'metadata';
    video.style.cssText = `
      width: 100%;
      height: auto;
      max-height: 60vh;
      border-radius: 14px;
      margin-bottom: 15px;
      pointer-events: auto;
    `;
    
    video.addEventListener('play', () => {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.HapticFeedback?.impactOccurred?.('light');
      }
    });
    
    sheetBody.insertBefore(video, sheetBody.firstChild);
  }
}
</script>
