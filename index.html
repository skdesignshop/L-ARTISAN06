<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>L'ARTISAN 06 — Boutique</title>

<!-- Intégration de la librairie Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase SDKs (Compat v10) - Ajout de Storage pour les médias -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

<!-- Polices d'écriture -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg-dark: #000000;
  --bg-gradient: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
  
  --bg2: #111111;
  --card: #151D1F; 
  --card2: #262D2D;
  
  --border: #FFD700; 
  --primary-yellow: #FFD700;
  --dark-yellow: #B8860B; 
  
  --text: #FFFFFF;
  --muted: #E0E0E0;
  --danger: #ff4c4c;
  
  --radius: 17px;
  --safe-bottom: env(safe-area-inset-bottom,0px);
  
  --shadow-gold: 0 0 15px rgba(255, 215, 0, 0.2);
}

@keyframes glare {
    0% { transform: translateX(-100%) rotate(15deg); }
    10% { transform: translateX(100%) rotate(15deg); }
    100% { transform: translateX(100%) rotate(15deg); }
}

.product-card, .category-button, .nav-btn.active, .cart-item, .info-card, .profile-row, .sheet, .product-sheet {
    position: relative;
    overflow: hidden;
}

.product-card::after, .category-button::after, .nav-btn.active::after, .cart-item::after, .info-card::after, .profile-row::after, .sheet::after, .product-sheet::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        to bottom right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0) 100%
    );
    transform: rotate(15deg);
    pointer-events: none;
    animation: glare 12s infinite;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width: 100%;
  min-height:100%;
  background: var(--bg-dark);
  background: var(--bg-gradient);
  background-attachment: fixed;
  overflow-x: hidden !important;
  position: relative;
}

body{
  color: var(--text);
  font-family:'Manrope',sans-serif;
  scrollbar-width: none;
}
body::-webkit-scrollbar {
  display: none;
}

button,input,textarea{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
  border: none;
  background: none;
  padding: 0;
}

button:active{
  transform:scale(.97);
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:100px;
  overflow-x: hidden;
}

.top{
  position:relative;
  z-index:30;
  padding:12px 14px 10px;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.logo{
  width:100%;
  aspect-ratio:1/1;
  max-height:430px;
  object-fit:cover;
  display:block;
  border-radius:20px;
  border: 1px solid var(--border);
  box-shadow: 
    var(--shadow-gold),
    0 0 20px rgba(255, 215, 0, 0.1);
  margin-bottom:13px;
}

.search{
  position:relative;
  margin-bottom:10px;
}

.search input{
  width:100%;
  height:48px;
  border-radius:14px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  padding:0 45px;
  outline:none;
  font-size:16px;
  transition: all 0.3s ease;
}

.search input:focus{
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.clear-search{
  display:none;
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background: var(--card2);
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}

.category-button{
  width:100%;
  height:52px;
  border: 1px solid var(--primary-yellow);
  border-radius:15px;
  background: linear-gradient(
    135deg,
    rgba(255, 215, 0, 0.15),
    rgba(0, 0, 0, 0.2)
  );
  color: var(--primary-yellow);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  font-size:14px;
  font-weight:800;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
  transition: 0.3s;
}

.category-button:active {
    background: rgba(255, 215, 0, 0.3);
}

.category-button .left{
  display:flex;
  align-items:center;
  gap:10px;
}

.category-button .arrow{
  transition:.3s;
  font-size: 20px;
  line-height: 1;
}

.category-button.open .arrow{
  transform:rotate(180deg);
}

.categories{
  display:none;
  margin-top:8px;
  padding:9px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius:15px;
  gap:7px;
  flex-wrap:wrap;
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.categories.open{
  display:flex;
}

.category{
  flex:1 1 calc(50% - 7px);
  min-height:42px;
  border-radius:11px;
  border: 1px solid #444;
  background: #111;
  color: var(--muted);
  font-size:12px;
  font-weight:800;
  transition: all 0.2s;
}

.category:hover {
    border-color: var(--dark-yellow);
}

.category.active{
  background: var(--primary-yellow);
  color: #000000;
  border-color: var(--primary-yellow);
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

main{
  padding:15px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:4px 0 13px;
  color: var(--primary-yellow);
  font-family:'Archivo Black',sans-serif;
  font-size:12px;
  letter-spacing:.13em;
  text-transform:uppercase;
  text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
}

.section-title:after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(
    90deg,
    var(--dark-yellow),
    transparent
  );
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.product-card{
  position:relative;
  overflow:hidden;
  background: var(--card);
  border: 1px solid #333;
  border-radius:17px;
  transition:all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.product-card:hover{
  border-color: var(--dark-yellow);
  transform: translateY(-3px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.4);
}

.product-image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#000;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition: transform 0.4s ease;
}

.product-card:hover .product-image {
    transform: scale(1.05);
}

.product-badge{
  position:absolute;
  top:9px;
  left:9px;
  padding:4px 8px;
  border-radius:20px;
  background: rgba(0, 0, 0, 0.85);
  border: 1px solid var(--dark-yellow);
  color: var(--primary-yellow);
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.04em;
  z-index: 5;
}

.product-content{
  padding:10px;
}

.product-name{
  margin:0 0 4px;
  font-size:13px;
  font-weight:900;
  color: #fff;
}

.product-description{
  color: var(--muted);
  font-size:9.5px;
  line-height:1.4;
  min-height:27px;
  margin-bottom:9px;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
}

.product-price{
  color: var(--primary-yellow);
  font-size:12px;
  font-weight:900;
  text-shadow: 0 0 3px rgba(255, 215, 0, 0.3);
}

.add-button{
  width:32px;
  height:32px;
  border: 1px solid var(--primary-yellow);
  border-radius:10px;
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(0,0,0,0.4));
  color: var(--primary-yellow);
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  transition: all 0.2s;
  line-height: 1;
}

.add-button:hover {
    background: rgba(255, 215, 0, 0.3);
    box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
}

.add-button:active {
    transform: scale(0.95);
}

.empty{
  text-align:center;
  color: var(--muted);
  padding:60px 20px;
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
  opacity: 0.5;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  max-width:520px;
  margin:auto;
  padding:8px 8px calc(8px + var(--safe-bottom));
  background: rgba(0, 0, 0, 0.98);
  backdrop-filter:blur(15px);
  border-top: 1px solid var(--border);
  display:flex;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
}

.nav-btn{
  flex:1;
  border:0;
  background:none;
  color: var(--muted);
  padding:6px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:9.5px;
  font-weight:800;
  position:relative;
  transition: color 0.2s;
}

.nav-btn svg{
  width:22px;
  height:22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  transition: 0.2s;
}

.nav-btn.active{
  color: var(--primary-yellow);
  text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
}

.nav-btn.active svg {
    filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
}

.badge{
  position:absolute;
  top:0;
  right:20%;
  min-width:16px;
  height:16px;
  padding:0 4px;
  display:none;
  align-items:center;
  justify-content:center;
  background:var(--danger);
  color:#FFFFFF;
  border-radius:20px;
  font-size:8px;
  font-weight: 900;
  box-shadow: 0 0 8px rgba(255, 76, 76, 0.5);
}

.profile-developer {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.profile-developer-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 20px;
  text-decoration: none;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  background: rgba(255, 215, 0, 0.05);
  border: 1px solid rgba(255, 215, 0, 0.3);
  transition: all 0.3s;
}

.profile-developer-badge:active {
  background: rgba(255, 215, 0, 0.15);
  transform: scale(0.95);
}

.profile-verified {
  width: 12px;
  height: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--primary-yellow);
  color: #000;
  font-size: 8px;
  font-weight: 900;
}

/* Bouton Admin Designifié */
@keyframes borderGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.admin-access-btn {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  border-radius: 13px;
  background: #111;
  color: var(--primary-yellow);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  z-index: 1;
  transition: all 0.2s;
}

.admin-access-btn::before {
  content: '';
  position: absolute;
  top: -2px; left: -2px; right: -2px; bottom: -2px;
  background: linear-gradient(45deg, var(--primary-yellow), #000, var(--dark-yellow), #000);
  background-size: 300% 300%;
  z-index: -1;
  border-radius: 15px;
  animation: borderGlow 4s ease infinite;
}

.admin-access-btn:active {
  transform: scale(0.98);
}

.view{
  display:none;
}

.view.active{
  display:block;
}

.page-title{
  font-family:'Archivo Black',sans-serif;
  font-size:23px;
  margin-bottom:17px;
  color: #fff;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
}

.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  margin-bottom:9px;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.cart-thumb{
  width:52px;
  height:52px;
  flex:0 0 52px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:#000;
  overflow:hidden;
}

.cart-thumb img, .cart-thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cart-info{
  flex:1;
  min-width:0;
}

.cart-info h4{
  margin:0 0 4px;
  font-size:12.5px;
  color: #fff;
}

.cart-meta{
  color:var(--muted);
  font-size:10px;
}

.cart-right{
  text-align:right;
}

.cart-price{
  color: var(--primary-yellow);
  font-size:12.5px;
  font-weight:800;
  margin-bottom:5px;
}

.qty{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
}

.qty button{
  width:24px;
  height:24px;
  border:1px solid var(--border);
  border-radius:6px;
  background:var(--card2);
  color: var(--primary-yellow);
  font-size:16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qty span{
  min-width:15px;
  text-align:center;
  font-size:11px;
  font-weight:800;
  color: #fff;
}

.summary{
  margin-top:15px;
  padding:15px;
  background:var(--card);
  border: 1px solid var(--primary-yellow);
  border-radius:16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.4);
}

.summary-row{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
}

.summary-row.total{
  padding-top:10px;
  border-top:1px solid #333;
  color:var(--text);
  font-size:16px;
  font-weight:800;
}

.summary-row.total span:last-child{
  color: var(--primary-yellow);
}

.submit{
  width:100%;
  height:50px;
  margin-top:8px;
  border:0;
  border-radius:13px;
  background: var(--primary-yellow);
  color:#000;
  font-size:14px;
  font-weight:900;
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
  transition: all 0.2s;
  display:flex;
  align-items:center;
  justify-content:center;
}

.submit:active {
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
}

.order-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}

.submit.whatsapp {
  background: #25D366;
  color: #fff;
  box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
}

.submit.telegram {
  background: #229ED9;
  color: #fff;
  box-shadow: 0 0 20px rgba(34, 158, 217, 0.4);
}

.info-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:11px;
}

.info-card h3{
  margin:0 0 8px;
  color: var(--primary-yellow);
  font-size:15px;
}

.info-card p{
  margin:0;
  color:var(--muted);
  line-height:1.55;
  font-size:12.5px;
}

.socials{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:12px;
}

.social{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  text-decoration:none;
  font-weight:800;
  font-size:13px;
}

.social-icon{
  width:39px;
  height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 39px;
  border-radius:11px;
  background: var(--primary-yellow);
  color:#000;
  overflow:hidden;
}

.social-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile{
  text-align:center;
  padding:10px 0 20px;
}

.avatar{
  width:82px;
  height:82px;
  margin:auto;
  border-radius:50%;
  border: 2px solid var(--primary-yellow);
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  margin-top:10px;
  font-family:'Archivo Black',sans-serif;
  font-size:19px;
  color: #fff;
}

.profile-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.profile-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:8px;
  font-size:12.5px;
  font-weight:700;
  color: #fff;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:80;
  background:rgba(0, 0, 0, 0.85);
  opacity:0;
  pointer-events:none;
  transition: opacity .2s ease;
  backdrop-filter: blur(5px);
  width: 100vw;
  height: 100vh;
}

.overlay.open{
  opacity:1;
  pointer-events:auto;
}

.sheet{
  position:fixed;
  z-index:81;
  left:0;
  right:0;
  bottom:0;
  width: 100%;
  max-width:520px;
  margin:auto;
  max-height:90vh;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling: touch;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-bottom:0;
  border-radius:22px 22px 0 0;
  transform:translateY(100%);
  transition: transform .28s ease-out;
  padding-bottom:calc(22px + var(--safe-bottom));
  box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
}

.sheet.open{
  transform:translateY(0);
}

.handle{
  width:38px;
  height:4px;
  background: #444;
  border-radius:5px;
  margin:10px auto;
}

.close{
  position:absolute;
  right:14px;
  top:12px;
  width:31px;
  height:31px;
  border-radius:50%;
  border:1px solid #333;
  background:rgba(0, 0, 0, 0.6);
  color:#fff;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sheet-body{
  padding:12px 16px;
  width: 100%;
  overflow-x: hidden;
}

.sheet-body video {
  width: 100%;
  height: auto;
  max-height: 60vh;
  pointer-events: auto !important;
  z-index: 1;
  border-radius: 14px;
  display: block;
  background: #000;
  margin-bottom: 15px;
}

.sheet h2{
  font-family:'Archivo Black',sans-serif;
  font-size:21px;
  margin:9px 0;
  color: #fff;
}

.sheet-description{
  color:var(--muted);
  font-size:12.5px;
  line-height:1.55;
}

/* Clavier PIN */
.pin-display {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}
.pin-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  transition: 0.2s;
}
.pin-dot.filled {
  background: var(--primary-yellow);
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  max-width: 280px;
  margin: 0 auto 20px auto;
}
.pin-btn {
  width: 100%;
  aspect-ratio: 1/1;
  background: var(--card);
  border: 1px solid #333;
  border-radius: 50%;
  color: #fff;
  font-size: 24px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.pin-btn:active {
  background: var(--dark-yellow);
  transform: scale(0.9);
}
.pin-btn.pin-action {
  background: transparent;
  border: 2px solid var(--primary-yellow);
  color: var(--primary-yellow);
}

</style>

</head>
<body>

<div class="app">
  <div class="top">
    <img src="" alt="" class="logo" id="logoImg">
    <div class="search">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Rechercher...">
      <button class="clear-search" id="clearSearch">✕</button>
    </div>
    
    <button class="category-button" id="categoryButton">
      <span class="left">
        <span>📂 Catégories</span>
      </span>
      <span class="arrow">▼</span>
    </button>
    <div class="categories" id="categories"></div>
  </div>

  <main>
    <div id="homeView" class="view active">
      <div id="productsContainer"></div>
    </div>
    <div id="cartView" class="view">
      <div class="page-title">🛒 Mon Panier</div>
      <div id="cartItems"></div>
      <div id="cartSummary"></div>
      <div class="order-actions" id="orderActions"></div>
    </div>
    <div id="profileView" class="view">
      <div class="page-title">👤 Profil</div>
      <div id="profileContent"></div>
    </div>
  </main>

  <div class="bottom-nav">
    <button class="nav-btn active" data-view="homeView">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Accueil
    </button>
    <button class="nav-btn" data-view="cartView">
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0020 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
      Panier
      <span class="badge" id="cartBadge">0</span>
    </button>
    <button class="nav-btn" data-view="profileView">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      Profil
    </button>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <button class="close" id="closeSheet">✕</button>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
// Gestion sécurisée des vidéos pour Telegram WebApp
function loadProductVideo(videoUrl) {
  const sheetBody = document.getElementById('sheetBody');
  if (sheetBody) {
    const existingVideos = sheetBody.querySelectorAll('video');
    existingVideos.forEach(v => v.remove());
    
    const video = document.createElement('video');
    video.src = videoUrl;
    video.controls = true;
    video.preload = 'metadata';
    video.style.cssText = `
      width: 100%;
      height: auto;
      max-height: 60vh;
      border-radius: 14px;
      margin-bottom: 15px;
      pointer-events: auto;
    `;
    
    video.addEventListener('play', () => {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.HapticFeedback?.impactOccurred?.('light');
      }
    });
    
    sheetBody.insertBefore(video, sheetBody.firstChild);
  }
}

// Initialisation Firebase et chargement des données
const firebaseConfig = {
  apiKey: "AIzaSyDO_S3s6VQpn5QcGKkJYtOlmLiMuVQ3tss",
  authDomain: "l-artisan06.firebaseapp.com",
  projectId: "l-artisan06",
  storageBucket: "l-artisan06.appspot.com",
  messagingSenderId: "271869876890",
  appId: "1:271869876890:web:5b81cc0c62e10b3d65c57e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let cart = [];
let products = [];
let categories = [];
let currentView = 'homeView';

// Charger les données
async function loadData() {
  try {
    const productsSnap = await db.collection('products').get();
    products = productsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    
    const categoriesSnap = await db.collection('categories').get();
    categories = categoriesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    
    renderProducts();
    renderCategories();
  } catch (error) {
    console.error('Erreur:', error);
  }
}

function renderProducts() {
  const container = document.getElementById('productsContainer');
  container.innerHTML = '<div class="section-title">✨ COLLECTION</div>';
  
  const grid = document.createElement('div');
  grid.className = 'grid';
  
  products.forEach(product => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-image-wrap">
        <img src="${product.image}" alt="${product.name}" class="product-image">
        <span class="product-badge">${product.badge || 'NEW'}</span>
      </div>
      <div class="product-content">
        <h3 class="product-name">${product.name}</h3>
        <p class="product-description">${product.description}</p>
        <div class="product-bottom">
          <span class="product-price">${product.price}€</span>
          <button class="add-button" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}" data-image="${product.image}" data-video="${product.video || ''}">+</button>
        </div>
      </div>
    `;
    
    card.addEventListener('click', () => showProductDetail(product));
    grid.appendChild(card);
  });
  
  container.appendChild(grid);
  
  document.querySelectorAll('.add-button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      addToCart(e.target);
    });
  });
}

function showProductDetail(product) {
  const sheetBody = document.getElementById('sheetBody');
  sheetBody.innerHTML = '';
  
  if (product.video) {
    loadProductVideo(product.video);
  }
  
  const content = document.createElement('div');
  content.innerHTML = `
    <h2>${product.name}</h2>
    <p class="sheet-description">${product.description}</p>
    <div class="info-card">
      <h3>Prix: ${product.price}€</h3>
      <p>${product.details || ''}</p>
    </div>
    <button class="submit" onclick="addToCartFromDetail('${product.id}', '${product.name}', ${product.price}, '${product.image}')">
      Ajouter au panier
    </button>
  `;
  sheetBody.appendChild(content);
  
  document.getElementById('sheet').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function addToCart(btn) {
  const item = {
    id: btn.dataset.id,
    name: btn.dataset.name,
    price: parseFloat(btn.dataset.price),
    image: btn.dataset.image,
    quantity: 1
  };
  
  const existing = cart.find(p => p.id === item.id);
  if (existing) existing.quantity++;
  else cart.push(item);
  
  updateCartBadge();
  showNotification('✓ Ajouté au panier');
}

function addToCartFromDetail(id, name, price, image) {
  const item = { id, name, price, image, quantity: 1 };
  const existing = cart.find(p => p.id === id);
  if (existing) existing.quantity++;
  else cart.push(item);
  
  updateCartBadge();
  closeSheet();
}

function updateCartBadge() {
  const badge = document.getElementById('cartBadge');
  const count = cart.reduce((sum, item) => sum + item.quantity, 0);
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';
}

function renderCategories() {
  const container = document.getElementById('categories');
  container.innerHTML = '';
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'category';
    btn.textContent = cat.name;
    btn.addEventListener('click', () => filterByCategory(cat.id));
    container.appendChild(btn);
  });
}

function filterByCategory(catId) {
  // Implémenter le filtrage
}

function showNotification(msg) {
  const notif = document.createElement('div');
  notif.textContent = msg;
  notif.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#FFD700;color:#000;padding:10px 20px;border-radius:8px;z-index:999;font-weight:900;';
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 2000);
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// Navigation
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(view).classList.add('active');
    
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    if (view === 'cartView') renderCart();
    else if (view === 'profileView') renderProfile();
  });
});

function renderCart() {
  const container = document.getElementById('cartItems');
  const summary = document.getElementById('cartSummary');
  
  if (cart.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">🛒</div>Panier vide</div>';
    summary.innerHTML = '';
    return;
  }
  
  container.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="cart-thumb"><img src="${item.image}" alt="${item.name}"></div>
      <div class="cart-info">
        <h4>${item.name}</h4>
        <span class="cart-meta">${item.price}€</span>
      </div>
      <div class="cart-right">
        <div class="cart-price">${(item.price * item.quantity).toFixed(2)}€</div>
        <div class="qty">
          <button onclick="updateQty('${item.id}', -1)">−</button>
          <span>${item.quantity}</span>
          <button onclick="updateQty('${item.id}', 1)">+</button>
        </div>
      </div>
    </div>
  `).join('');
  
  const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  summary.innerHTML = `
    <div class="summary">
      <div class="summary-row"><span>Sous-total</span><span>${total.toFixed(2)}€</span></div>
      <div class="summary-row total"><span>Total</span><span>${total.toFixed(2)}€</span></div>
      <div class="order-actions">
        <button class="submit whatsapp" onclick="orderVia('whatsapp', ${total})">💬 WhatsApp</button>
        <button class="submit telegram" onclick="orderVia('telegram', ${total})">✈️ Telegram</button>
      </div>
    </div>
  `;
}

function updateQty(id, change) {
  const item = cart.find(p => p.id === id);
  if (item) {
    item.quantity += change;
    if (item.quantity <= 0) cart = cart.filter(p => p.id !== id);
    updateCartBadge();
    renderCart();
  }
}

function orderVia(platform, total) {
  const items = cart.map(i => `${i.name} (x${i.quantity})`).join(', ');
  const msg = `Commande L'ARTISAN 06: ${items} | Total: ${total.toFixed(2)}€`;
  
  if (platform === 'whatsapp') {
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
  } else {
    window.open(`https://t.me/share/url?text=${encodeURIComponent(msg)}`);
  }
}

function renderProfile() {
  const container = document.getElementById('profileContent');
  container.innerHTML = `
    <div class="profile">
      <div class="avatar"><img src="https://via.placeholder.com/82" alt="Profile"></div>
      <div class="profile-name">L'ARTISAN 06</div>
      <div class="profile-sub">Boutique Officielle</div>
    </div>
    <div class="info-card">
      <h3>À propos</h3>
      <p>Bienvenue dans notre boutique en ligne. Nous proposons les meilleurs produits artisanaux.</p>
    </div>
    <div class="socials" id="socials"></div>
    <div class="profile-developer">
      <a href="#" class="profile-developer-badge">🔗 Plus d'infos</a>
    </div>
  `;
}

// Fermer le sheet
document.getElementById('closeSheet').addEventListener('click', closeSheet);
document.getElementById('overlay').addEventListener('click', closeSheet);

document.getElementById('categoryButton').addEventListener('click', () => {
  document.getElementById('categories').classList.toggle('open');
  document.getElementById('categoryButton').classList.toggle('open');
});

// Charger au démarrage
loadData();
</script>

</body>
</html>
